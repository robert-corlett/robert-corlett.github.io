<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>corlett.cc</title>
    <link href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAQEBACMjIwADAwMACQkJAAQEBAAFBQUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAAEAAAAAAAAAAMAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAABRAAEAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAADwDwAA8AcAAPALAADwDQAA+B0AAPg9AAD4PQAA+D0AAPAdAADwHwAA8B8AAPAfAADznwAA998AAP//AAD//wAA" rel="icon" type="image/x-icon">
    <style>
      html {
        background-color: #a6e3de;
      }
    	#cat {
    		position: absolute;
    		top: 50%;
    		left: 50%;
    		margin-right: -50%;
    		transform: translate(-50%, -50%);
    	}
    </style>
  </head>
  <body>
    <canvas id="cat" width="150" height="150"></canvas>
    <script type="module">
      import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

      let kitties = [
        "ginger-cat.lottie",
        "sleepy-kitty.lottie" 
      ];
      
      let kitty = kitties[Math.floor(Math.random() * kitties.length)];

      new DotLottie({
        autoplay: true,
        loop: true,
        canvas: document.getElementById("cat"),
        src: kitty, 
      });
    </script>
  </body>
</html>
